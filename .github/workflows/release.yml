name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          scripts/verify-release-tag.sh RELEASE_SIGNING_KEY.asc "$GITHUB_REF_NAME" BFA7D43C126EE54A5FC8DD0EBE645A3EFA752D77
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" origin/main
          version=${GITHUB_REF_NAME#v}
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(cat VERSION)" = "$version"

      - name: Run tests
        run: make test

  package:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          python3 scripts/package_release.py "$version"
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"

      - name: Upload exact release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/codex-next-prompt-${{ env.RELEASE_VERSION }}.zip
            dist/codex-next-prompt-${{ env.RELEASE_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    permissions:
      contents: write
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download exact release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: dist

      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          if gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >"$response" 2>&1; then
            api_exit=0
          else
            api_exit=$?
          fi
          http_status=$(awk 'NR == 1 {print $2}' "$response")
          case "$http_status" in
          404) ;;
          200)
            printf '%s\n' "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
            ;;
          *)
            printf '%s\n' "release lookup failed (status ${http_status:-none}, exit $api_exit)" >&2
            exit 1
            ;;
          esac

      - name: Publish exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          archive="dist/codex-next-prompt-${version}.zip"
          checksum="${archive}.sha256"
          gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
