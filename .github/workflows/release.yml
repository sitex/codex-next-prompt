name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without a leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run repository checks
        run: make check

      - name: Check generated files
        shell: bash
        run: |
          set -eu
          test ! -e go.sum
          test -z "$(git ls-files 'bin/*' 'dist/*')"
          git diff --exit-code

  package:
    name: Package ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          raw_version=${INPUT_VERSION:-${GITHUB_REF_NAME}}
          version=${raw_version#v}
          test -n "$version"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Package target
        shell: bash
        run: scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.goos }}" "${{ matrix.goarch }}"

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          raw_version=${INPUT_VERSION:-${GITHUB_REF_NAME}}
          version=${raw_version#v}
          test -n "$version"
          printf 'tag=v%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$RELEASE_TAG"
          fi
