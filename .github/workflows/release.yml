name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify signed release source
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag identity and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git verify-tag "$GITHUB_REF_NAME"
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$tag_commit" = "$GITHUB_SHA"
          version=${GITHUB_REF_NAME#v}
          test "$GITHUB_REF_NAME" = "v$version"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run repository checks
        run: make check

      - name: Check repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test ! -e go.sum
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  package:
    name: Package and smoke ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Package target
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: scripts/package-release.sh "$RELEASE_VERSION" "$TARGET_GOOS" "$TARGET_GOARCH"

      - name: Upload tested target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  smoke-windows:
    name: Smoke extracted Windows ${{ matrix.goarch }} archive
    needs: package
    if: always() && needs.package.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: windows-latest
          - goarch: arm64
            runner: windows-11-arm

    steps:
      - name: Check out smoke test
        uses: actions/checkout@v4

      - name: Download Windows archive
        uses: actions/download-artifact@v5
        with:
          name: release-windows-${{ matrix.goarch }}
          path: dist

      - name: Run extracted Windows launcher smoke
        shell: pwsh
        run: tests/smoke-windows.ps1 (Get-ChildItem dist/*.zip -File -Single)

  publish:
    name: Publish immutable GitHub release
    needs: [package, smoke-windows]
    if: always() && needs.package.result == 'success' && needs.smoke-windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download tested release archives
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
