name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          set -eu
          files=$(git ls-files '*.go')
          test -n "$files"
          test -z "$(gofmt -l $files)"

      - name: Vet
        shell: bash
        run: GOTOOLCHAIN=auto go vet ./...

      - name: Test with race detector
        shell: bash
        run: GOTOOLCHAIN=auto go test -race -shuffle=on -count=1 ./...

      - name: Build native binary
        shell: bash
        run: GOTOOLCHAIN=auto CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/codex-next-prompt${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/codex-next-prompt

      - name: Run POSIX native smoke
        if: runner.os != 'Windows'
        shell: bash
        run: tests/smoke-posix.sh

      - name: Run Windows native smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/smoke-windows.ps1

      - name: Check repository cleanliness
        shell: bash
        run: |
          set -eu
          test ! -e go.sum
          test -z "$(git ls-files 'bin/*' 'dist/*')"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
